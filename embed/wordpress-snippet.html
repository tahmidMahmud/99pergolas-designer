<script>
(function () {
  var f = document.getElementById('p99-designer'); if (!f || f.dataset.ready) return; f.dataset.ready = '1';
  var u = new URL(f.getAttribute('src'), location.href), ORIGIN = u.origin;
  var q = new URLSearchParams(location.search), src = {};
  ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','utm_id','gclid','gbraid','wbraid','fbclid','msclkid','ttclid'].forEach(function (k) {
    var v = q.get(k); if (v) { src[k] = v; u.searchParams.set(k, v); }
  });
  var hutk = (document.cookie.match(/(?:^|;\s*)hubspotutk=([a-f0-9]+)/i) || [])[1];
  if (hutk) src.hutk = hutk;
  src.page = location.origin + location.pathname; if (document.referrer) src.ref = document.referrer;
  u.searchParams.set('src', JSON.stringify(src));
  f.src = u.toString();
  function fit(h) { var max = Math.max(640, window.innerHeight - 24); f.style.height = Math.round(Math.max(640, Math.min(h, max))) + 'px'; }
  var last = 0; window.addEventListener('resize', function () { if (last) fit(last); });
  window.addEventListener('message', function (e) {
    var d = e.data; if (e.origin !== ORIGIN || e.source !== f.contentWindow || !d || typeof d !== 'object') return;
    if (d.type === '99p:height' && d.height > 0) { last = +d.height; fit(last); }
    else if (d.type === '99p:ready' && hutk) { f.contentWindow.postMessage({ type: '99p:hutk', value: hutk }, ORIGIN); }
    else if (d.type === '99p:lead') {
      if (typeof window.gtag === 'function') window.gtag('event', 'generate_lead', { form_id: '99p-designer', product: d.kind, value: d.value || 0, currency: 'USD' });
      if (typeof window.fbq === 'function') window.fbq('track', 'Lead', { content_name: d.kind, value: d.value || 0, currency: 'USD' });
    }
  });
})();
</script>
